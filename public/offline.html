<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>No internet</title>
    <!-- Shown by the Android app (from inside the APK) when the website can't be reached. -->
    <style>
      :root { --bg: #f7f7f5; --fg: #1c1c1a; --muted: #6b6b66; --brand: #c2410c; }
      @media (prefers-color-scheme: dark) { :root { --bg: #151514; --fg: #f0f0ec; --muted: #a3a39c; --brand: #fb923c; } }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg); color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: var(--muted); font-size: 14px; margin: 0 0 20px; line-height: 1.5; }
      button {
        background: var(--brand); color: #fff; border: 0; border-radius: 10px;
        font-size: 16px; font-weight: 600; padding: 12px 28px;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>No internet</h1>
      <p>Mahadeva Foods needs the internet to open.<br />Check your connection and try again.</p>
      <button type="button" onclick="location.replace('https://mfp-frontend-omega.vercel.app/')">Try again</button>
    </div>
  </body>
</html>
